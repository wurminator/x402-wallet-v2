[package]
name = "x402-wallet"
version = "0.2.2"
edition = "2021"

[features]
default = []
mcp = ["pmcp"]   # optional; leave off for now

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
ethers = { version = "2.0.14", features = ["eip712","abigen","rustls"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["full"] }
url = "2.5"
zeroize = "1.8"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }

# Optional MCP server (disabled by default)
pmcp = { version = "1.5.4", optional = true }