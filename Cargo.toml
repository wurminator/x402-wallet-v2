[package]
name = "x402-wallet"
version = "0.3.2"
edition = "2021"

[dependencies]
alloy = { version = "2.4", features = ["eip712"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["full"] }
url = "2.5"
zeroize = "1.8"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
