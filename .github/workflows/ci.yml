name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (no system OpenSSL needed — rustls only)
        run: cargo build --release

      - name: Run tests (offline, no funds involved)
        run: cargo test

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true # enable once existing warnings are cleaned up

      - name: Format check
        run: cargo fmt --check
        continue-on-error: true # enable once formatting is applied repo-wide

  # Optional: cross-platform smoke build (the wallet is pure rustls,
  # so it should compile everywhere without system deps)
  build-windows:
    name: Smoke Build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build
        run: cargo build --release
